
openapi: 3.1.0
info:
  title: catalog-service
  version: 1.0.0
  description: Каталог товаров интернет-магазина электроники.
  license:
    name: UNLICENSED
    url: https://opensource.org/license/unlicense
servers:
- url: https://catalog.electroshop.ru
  description: Адрес сервиса в целевой среде развертывания; заменить на фактический URL при публикации.
paths:
  /api/v1/products:
    get:
      tags: [public]
      summary: Получить список товаров
      parameters:
      - in: query
        name: page
        schema: {type: integer, minimum: 1, default: 1}
      - in: query
        name: size
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      - in: query
        name: search
        schema: {type: string}
      responses:
        '200':
          description: Список товаров
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Product'}
                  page: {type: integer}
                  size: {type: integer}
                  total: {type: integer}
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: get_api_v1_products
      security: []
    post:
      tags: [public]
      summary: Создать товар
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
            example: {sku: "KB-100", name: "Keyboard", description: "USB keyboard", price: 2500, currency: "RUB"}
      responses:
        '201':
          description: Товар создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: post_api_v1_products
  /api/v1/products/{productId}:
    get:
      tags: [public]
      summary: Получить товар по ID
      parameters:
      - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Товар
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: get_api_v1_products_productId
      security: []
  /internal/v1/products/{productId}:
    get:
      tags: [internal]
      summary: Получить внутренние данные товара для заказа
      parameters:
      - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: SKU и цена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: get_internal_v1_products_productId
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductId:
      in: path
      name: productId
      required: true
      schema: {type: string, format: uuid}
  schemas:
    ProductInput:
      type: object
      required: [sku, name, price, currency]
      properties:
        sku: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        description: {type: string}
        price: {type: number, minimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3, example: RUB}
    Product:
      allOf:
      - $ref: '#/components/schemas/ProductInput'
      - type: object
        required: [id, createdAt]
        properties:
          id: {type: string, format: uuid}
          createdAt: {type: string, format: date-time}
    Problem:
      type: object
      required: [title, status]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        traceId: {type: string}
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Требуется аутентификация
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
